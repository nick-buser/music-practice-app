[project]
name = "soundings-backend"
version = "0.1.0"
description = "Soundings practice-app backend — thin CRUD over Postgres, built to grow into music computation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "structlog>=24.1",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    # PV3's `midi-features` extractor: pure-Python SMF parsing (~60 KB, no
    # native/compiled deps) — clears the laptop's disk-discipline rule.
    "mido>=1.3",
    # SB6's `manifest.yaml` (app/export/manifest.py) needs YAML. Already
    # installed as a transitive of `uvicorn[standard]` (confirmed with
    # `uv tree`), so this declares an existing dependency honestly rather
    # than adding a new download — the laptop's disk-discipline rule.
    "pyyaml>=6.0",
]

[dependency-groups]
# Observability is optional at runtime (no-ops when OTEL endpoint is unset), but
# kept in its own group so the production image can install it explicitly.
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "polyfactory>=2.16",
    # Heavier, opt-in suites (see pytest markers): real Postgres + contract fuzz.
    "schemathesis>=3.33",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
default-groups = ["dev"]

# ─── Ruff (lint + format) ─────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pyflakes / pycodestyle
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM",              # simplify
    "TID",              # tidy imports
    "RUF",              # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

# ─── Pyright (strict type checking) ───────────────────────────────────
[tool.pyright]
include = ["app", "scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# FastAPI registers handlers/middleware via decorators on inner functions, which
# strict mode otherwise reads as "never called".
reportUnusedFunction = false

# App code is strict. Tests lean on the httpx-based TestClient (whose `.json()`
# is `Any`), so the "unknown type" family is noise there — relax just those.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportMissingParameterType = false

# ─── Pytest ───────────────────────────────────────────────────────────
[tool.pytest.ini_options]
# Fast, hermetic SQLite suite runs by default; the heavier real-Postgres and
# OpenAPI-contract suites are opt-in (`-m integration`, `-m contract`).
addopts = "-ra -m 'not integration and not contract'"
markers = [
    "integration: exercises a real Postgres (needs DATABASE_URL pointing at one)",
    "contract: property-based OpenAPI fuzzing (schemathesis)",
]
testpaths = ["tests"]
