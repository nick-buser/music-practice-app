# Backend CI — lint, types, tests (incl. the openapi drift guard).
#
# Targets the Woodpecker 1.0+ schema. The official uv image ships Python 3.12 +
# uv; `setup` builds .venv in the shared workspace and later steps reuse it via
# `uv run`. Assumes a Docker backend with network egress (PyPI + the node that
# the `pyright` package fetches on first run).
when:
  event: [push, pull_request]
  path:
    include:
      - 'backend/**'
      - '.woodpecker/backend.yml'

steps:
  - name: setup
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    commands:
      - cd backend
      - uv sync --frozen

  - name: lint
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    commands:
      - cd backend
      - uv run ruff check .
      - uv run ruff format --check .

  - name: typecheck
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    commands:
      # pyright-python downloads its own prebuilt node on first run, and that
      # binary links against libatomic, which bookworm-slim does not ship. The
      # step therefore exits 127 with
      #   node: error while loading shared libraries: libatomic.so.1
      # and takes `test` down with it as skipped. This is the smallest fix that
      # keeps the same image as every other step (fix-0003).
      - apt-get update -qq && apt-get install -y --no-install-recommends libatomic1
      - cd backend
      - uv run pyright

  - name: test
    # Default suite: fast SQLite + the openapi-drift guard. Deselects
    # `integration` and `contract` (see addopts in pyproject.toml) — the
    # real-Postgres `integration` suite runs separately in `test-postgres`
    # below; `contract` (schemathesis) is still opt-in only.
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    commands:
      - cd backend
      - uv run pytest

  - name: test-postgres
    # Real-Postgres suite (tests/test_integration_postgres.py): JSONB
    # round-trip + an Alembic upgrade/downgrade/upgrade round trip against a
    # live server. The `postgres` service's port can accept TCP connections
    # before Postgres itself is ready for queries, so wait it out with a
    # bounded psycopg connect-retry loop first — this image (bookworm-slim)
    # has no `pg_isready`, and psycopg is already a backend dependency, so
    # this needs no apt-get.
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/postgres
    commands:
      - cd backend
      - |
        uv run python -c "
        import sys
        import time

        import psycopg

        deadline = time.monotonic() + 30
        last_err: Exception | None = None
        while time.monotonic() < deadline:
            try:
                psycopg.connect(
                    'postgresql://postgres:postgres@postgres:5432/postgres',
                    connect_timeout=2,
                ).close()
                break
            except Exception as exc:
                last_err = exc
                time.sleep(1)
        else:
            sys.exit(f'postgres service not ready after 30s: {last_err}')
        "
      - uv run pytest -q -m integration

services:
  - name: postgres
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
