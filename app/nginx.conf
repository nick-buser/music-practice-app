# Standalone nginx.conf (replaces the image default outright — no conf.d
# includes) for serving the built SPA in app/Dockerfile.web.
user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # k8s liveness/readiness probes hit this directly, so it must never
        # fall through to the SPA's index.html handler below.
        location = /healthz {
            default_type text/plain;
            return 200 'ok';
        }

        # Hashed filenames (Vite's default asset naming) are safe to cache
        # forever; a new deploy ships new filenames, never mutates old ones.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Never cache the entry document, so a new deploy is picked up
        # immediately instead of being served stale from a client cache.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # Client-side routing: unmatched paths fall back to index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
